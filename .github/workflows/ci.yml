# Runs the safety/style checks and the tests on every pull request into dev, qc or main.
# The job is named "checks"; select that name in the GitHub ruleset ("Require status checks to pass")
# after this workflow has run once.
name: ci

on:
  pull_request:
    branches: [dev, qc, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest   # Linux minutes are the cheapest on GitHub's free allowance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Style and safety checks (pre-commit)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: pytest
